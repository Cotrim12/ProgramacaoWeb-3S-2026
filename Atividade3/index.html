<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Atividade DOM</title>
</head>
<body>

    <h2>Contador de Cliques</h2>
    <button id="btnMais">+</button>
    <button id="btnMenos">-</button>
    <span id="contador">0</span>

    <h2>Adicionar Texto</h2>
    <input type="text" id="inputTexto" placeholder="Digite algo e pressione Enter">
    <p>Caracteres (sem espaço): <span id="charCount">0</span></p>
    <div id="areaTexto"></div>

    <h2>Adicionar Lista</h2>
    <select id="tipoLista">
        <option value="ul">Lista não ordenada</option>
        <option value="ol">Lista ordenada</option>
    </select>
    <button id="addLista">Adicionar Lista</button>
    <div id="areaListas"></div>

    <h2>Reset</h2>
    <button id="resetar">Resetar Tudo</button>

    <script src="script.js"></script>
</body>
</html>
